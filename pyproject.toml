[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "category-lora"
version = "0.1.0"
description = "LoRA for category-indexed Linear layers (3D weight tensors)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "jeqcho"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
]

[project.optional-dependencies]
peft = ["peft>=0.10,<1.0"]
dev = ["pytest>=7", "pytest-cov", "torch>=2.1"]

[project.urls]
Homepage = "https://github.com/jeqcho/category-lora"
Repository = "https://github.com/jeqcho/category-lora"
Issues = "https://github.com/jeqcho/category-lora/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
